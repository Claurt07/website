<script type="text/javascript">
    const siteId = 1;
    const domain = "*.hotosm.org";
    const matomoURL = "https://matomo.hotosm.org/";
    const matomoFile = "piwik.php";

    var _paq = window._paq = window._paq || [];
    _paq.push(["requireConsent"]);
    _paq.push(["setDomains", [domain]]);
    _paq.push(["trackPageView"]);
    _paq.push(["enableLinkTracking"]); // Tracks downloads
    _paq.push(["trackVisibleContentImpressions"]); // Tracks content

    (function() {
        var u=matomoURL;
        _paq.push(['setTrackerUrl', u + matomoFile]);
        _paq.push(['setSiteId', siteId]);
        var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
        g.type='text/javascript'; g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
    })();

    const consent = document.getElementById('gdpr-consent');

    // Visitors who already answered the old banner shouldn't be asked again
    if (localStorage.getItem("optout-closed")) {
        consent.removeAttribute('is-open');
    }

    // Set the title as a property once the component is ready (see GDPRBanner.html)
    customElements.whenDefined('hot-consent').then(async () => {
        consent.title = consent.dataset.title;

        // WORKAROUND (remove once hotosm/ui can hide the icon): the shield icon doesn't
        // display but still reserves space on the left, pushing the content off-centre.
        // Hide it from inside the component. If hotosm/ui renames the icon's class,
        // this simply stops applying and the banner is off-centre again, nothing breaks.
        try {
            await consent.updateComplete;
            const sheet = new CSSStyleSheet();
            sheet.replaceSync('.consent-icon { display: none; }');
            consent.shadowRoot.adoptedStyleSheets = [...consent.shadowRoot.adoptedStyleSheets, sheet];
        } catch (e) {
            // Older browsers: leave the banner as it is
        }
    });

    // Pass the visitor's choice on to Matomo and Clarity, as before
    consent.addEventListener('agree', () => {
        _paq.push(['rememberConsentGiven']);
        window.clarity('consentv2', {ad_Storage: "granted", analytics_Storage: "granted"});
    });

    consent.addEventListener('disagree', () => {
        _paq.push(['forgetConsentGiven']);
        window.clarity('consentv2', {ad_Storage: "denied", analytics_Storage: "denied"});
    });
</script>

        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);

</script>
